[package]
name = "blitzvox"
version = "2.0.0"
description = "Speech-to-text desktop app for Windows 11 and Linux Debian"
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "blitzvox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
fancy-regex = "0.20.2"
cpal = "0.18.2"
arboard = { version = "3.7.0", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "multipart", "query"] }
tokio = { version = "1.54.1", features = ["time", "fs", "io-util", "rt"] }
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
# Direkt nur für die sichere Abfrage der Vulkan-Geräte über die ggml-Registry
# (gleiche Version wie in whisper-rs, damit es dieselbe Bibliothek ist).
whisper-rs-sys = { version = "=0.15.0", features = ["vulkan"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "6.0.0", features = ["crypto-rust"] }
x11rb = { version = "0.14.0", features = ["record"] }
# Wayland: Tastatur über /dev/input lesen, Strg+V über /dev/uinput, Portal-Kürzel
evdev = "0.13.2"
# Nicht "tokio": das schaltet zbus auf eine gemeinsame Tokio-Laufzeit um, und die
# blockierenden Schlüsselbund-Aufrufe (secret-service) können dann hängen bleiben.
ashpd = { version = "0.14.3", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["sync", "macros"] }
