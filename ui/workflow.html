<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>BlitzVox</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main {
      padding: 24px 24px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #waveform {
      width: 100%;
      height: 40px;
      display: block;
    }
    #result {
      width: 100%;
      max-height: 150px;
      min-height: 80px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    .buttons button {
      flex: 1;
    }
    .center {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main id="main">
    <header>
      <div class="plaque" id="icon"></div>
      <div>
        <div class="display" id="title"></div>
        <div class="hint" id="subtitle"></div>
      </div>
    </header>
    <hr>
    <canvas id="waveform"></canvas>
    <div class="status" id="status">Bereit</div>
    <textarea id="result" class="hidden" readonly></textarea>
    <div class="buttons">
      <button id="record" class="primary lg">🎙  Aufnahme starten</button>
      <button id="copy" class="lg hidden">📋  Kopieren</button>
    </div>
    <div class="center">
      <button id="cancel" class="text">Abbrechen</button>
    </div>
  </main>
  <script src="keys.js"></script>
  <script src="workflow.js"></script>
</body>
</html>
