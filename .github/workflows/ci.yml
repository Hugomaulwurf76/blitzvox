name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Linux-Pakete installieren
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config cmake clang libclang-dev libvulkan-dev glslc \
            libasound2-dev libdbus-1-dev

      - name: Vulkan SDK installieren (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          install_runtime: true
          cache: true
          stripdown: false

      - name: Kurzer Build-Pfad (Windows, whisper.cpp scheitert an langen Pfaden)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> ${{ runner.os == 'Windows' && 'C:\t' || 'target' }}

      - name: cargo test --lib
        run: cargo test --lib

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb
          - name: Windows
            os: windows-2025
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Linux-Pakete installieren
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config cmake clang libclang-dev libvulkan-dev glslc \
            libasound2-dev libdbus-1-dev

      - name: Vulkan SDK installieren (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          install_runtime: true
          cache: true
          stripdown: false

      - name: Kurzer Build-Pfad (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> ${{ runner.os == 'Windows' && 'C:\t' || 'target' }}
          cache-bin: true

      - name: tauri-cli installieren
        run: cargo install tauri-cli --version 2.12.6 --locked

      - name: cargo tauri build
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Paket hochladen
        uses: actions/upload-artifact@v7
        with:
          name: blitzvox-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            C:\t\release\bundle\nsis\*.exe
          if-no-files-found: error
          retention-days: 14
